  - obligation_code: AI_ACT_GPAI_OBLIGATIONS
    legal_source_short_name: AI_ACT
    citation_label: "AI Act Title VIII — GPAI"
    title: "General-Purpose AI Model Obligations"
    description: >
      Providers of general-purpose AI models must:
      Prepare technical documentation.
      Provide information to downstream providers.
      Establish copyright compliance policy.
      Publish summary of training data.
      For models with systemic risk: conduct adversarial testing, report serious incidents,
      ensure cybersecurity protections, report energy consumption.
      GPAI obligations apply from August 2025.
