      Risk-based. Prohibited practices: Feb 2025.
      GPAI obligations: Aug 2025.
      High-risk (some Annex III): Aug 2026.
      Other high-risk: Dec 2027 / Aug 2028.
      Ireland: 15 competent authorities. AI Office of Ireland from Aug 2026.

