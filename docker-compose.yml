version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: camiro
      POSTGRES_PASSWORD: camiro
      POSTGRES_DB: camiro
    ports:
      - "5432:5432"
    volumes:
      - camiro_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camiro"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://camiro:camiro@db:5432/camiro
      API_KEY: ${API_KEY}
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  camiro_db:
